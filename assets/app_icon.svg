<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Фон: скруглённый квадрат с градиентом -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Корпус цилиндра -->
  <path d="M54,86 L54,174 C54,189 87.1,201 128,201 C168.9,201 202,189 202,174 L202,86" fill="#ffffff"/>

  <!-- Нижний овал -->
  <ellipse cx="128" cy="174" rx="74" ry="27" fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- Крышка (верхний овал) -->
  <ellipse cx="128" cy="86" rx="74" ry="27" fill="url(#lid)"/>

  <!-- Данные внутри цилиндра -->
  <rect x="88" y="106" width="80" height="13" rx="6.5" fill="#3b82f6"/>
  <rect x="88" y="128" width="80" height="13" rx="6.5" fill="#3b82f6"/>
  <rect x="88" y="150" width="80" height="13" rx="6.5" fill="#3b82f6"/>
</svg>
